version: '3.8'

services:
  postgres:
    container_name: postgresql_criptografia
    image: postgres:latest
    environment:
      - POSTGRES_DB=db_criptografia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    ports:
      - '5431:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
